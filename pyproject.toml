[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "stitchvm"
version = "0.1.0"
description = "StitchVM: layer search and value-model distillation"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "The StitchVM Authors" }]
# Install runtime dependencies using the setup instructions in README.md.
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["stitchvm*", "config*"]
